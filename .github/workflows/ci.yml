name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Composer validate
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l querynova.php && php -l uninstall.php
      - name: PHPCS
        run: composer lint
      - name: PHPStan
        run: composer analyse
      - name: PHPUnit
        run: composer test

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install admin dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test
      - name: Production build
        run: npm run build
